<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ — SMART WOLFFIA FARM</title>
  
  <!-- Google Fonts: Prompt & Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Supabase Client JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">

  <!-- Ambient Glows -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Login Card Box -->
  <div class="panel-card" style="width: 100%; max-width: 440px; padding: 32px; border: 1px solid var(--color-emerald-primary); box-shadow: 0 0 40px var(--color-emerald-glow);">
    
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="brand-icon" style="width: 60px; height: 60px; font-size: 28px; margin: 0 auto 14px auto;">
        <i class="fa-solid fa-leaf"></i>
      </div>
      <h1 style="font-size: 1.5rem; color: var(--text-main);">🌱 SMART WOLFFIA FARM</h1>
      <p style="font-size: 0.85rem; color: var(--text-sub); margin-top: 6px; line-height: 1.4;">
        ระบบเพาะเลี้ยงไข่ผำอัจฉริยะเพื่อการผลิตโปรตีนทางเลือก
      </p>
    </div>

    <!-- Alert Message Box -->
    <div id="loginAlert" style="display: none; padding: 10px 14px; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 16px;"></div>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="form-group" style="margin-bottom: 14px;">
        <label style="font-size: 0.88rem; color: var(--text-main); margin-bottom: 4px; display: block;">
          <i class="fa-solid fa-envelope text-emerald"></i> อีเมล (Email):
        </label>
        <input type="email" id="loginEmail" class="form-control" placeholder="admin@wolffia.farm" required style="width: 100%; padding: 10px 14px;">
      </div>

      <div class="form-group" style="margin-bottom: 12px; position: relative;">
        <label style="font-size: 0.88rem; color: var(--text-main); margin-bottom: 4px; display: block;">
          <i class="fa-solid fa-lock text-cyan"></i> รหัสผ่าน (Password):
        </label>
        <div style="position: relative;">
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required style="width: 100%; padding: 10px 40px 10px 14px;">
          <button type="button" id="btnTogglePassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 1rem;" title="แสดง/ซ่อน รหัสผ่าน">
            <i class="fa-solid fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; margin-bottom: 16px;">
        <a id="btnForgotPassword" href="#" style="font-size: 0.8rem; color: var(--color-cyan-primary); text-decoration: none;">
          <i class="fa-solid fa-key"></i> ลืมรหัสผ่าน?
        </a>
      </div>

      <button type="submit" id="btnLoginSubmit" class="btn-primary" style="width: 100%; padding: 12px; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ (LOGIN)
      </button>
    </form>

    <div style="text-align: center; margin: 20px 0; position: relative;">
      <hr style="border: 0; border-top: 1px solid var(--bg-card-border);">
      <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--bg-card); padding: 0 10px; font-size: 0.75rem; color: var(--text-muted);">หรือ</span>
    </div>

    <!-- Public Access Button -->
    <button id="btnPublicAccess" class="btn-secondary" style="width: 100%; padding: 10px; font-size: 0.88rem; border-color: var(--color-emerald-primary); color: var(--color-emerald-primary); display: flex; align-items: center; justify-content: center; gap: 8px;">
      <i class="fa-solid fa-globe"></i> เข้าชมระบบแบบ Public (ไม่ต้อง Login)
    </button>

    <div style="text-align: center; margin-top: 20px; font-size: 0.78rem; color: var(--text-muted);">
      &copy; 2026 Smart Wolffia Farm V3 — Supabase RBAC Protected
    </div>
  </div>

  <script src="config.js"></script>
  <script src="authService.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const loginForm = document.getElementById("loginForm");
      const loginAlert = document.getElementById("loginAlert");
      const loginPassword = document.getElementById("loginPassword");
      const btnTogglePassword = document.getElementById("btnTogglePassword");
      const eyeIcon = document.getElementById("eyeIcon");
      const btnForgotPassword = document.getElementById("btnForgotPassword");
      const btnPublicAccess = document.getElementById("btnPublicAccess");

      function showAlert(msg, isError = true) {
        loginAlert.style.display = "block";
        loginAlert.style.background = isError ? "rgba(239, 68, 68, 0.15)" : "rgba(16, 185, 129, 0.15)";
        loginAlert.style.color = isError ? "var(--color-rose-danger)" : "var(--color-emerald-primary)";
        loginAlert.style.border = `1px solid ${isError ? "var(--color-rose-danger)" : "var(--color-emerald-primary)"}`;
        loginAlert.innerHTML = `<i class="${isError ? 'fa-solid fa-triangle-exclamation' : 'fa-solid fa-circle-check'}"></i> ${msg}`;
      }

      // Show/Hide Password Toggle
      btnTogglePassword.addEventListener("click", () => {
        const isPassword = loginPassword.getAttribute("type") === "password";
        loginPassword.setAttribute("type", isPassword ? "text" : "password");
        eyeIcon.className = isPassword ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
      });

      // Forgot Password Click Handler
      btnForgotPassword.addEventListener("click", (e) => {
        e.preventDefault();
        alert("🔑 กรุณาติดต่อผู้ดูแลระบบ (Admin) เพื่อทำการรีเซ็ตรหัสผ่านของคุณ");
      });

      // Public Access Handler
      btnPublicAccess.addEventListener("click", () => {
        sessionStorage.setItem("wolffia_user", JSON.stringify({
          email: "public@wolffia.farm",
          role: "public",
          display_name: "Public Viewer"
        }));
        window.location.href = "index.html";
      });

      // Handle Login Form Submit
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value.trim();
        const password = loginPassword.value.trim();

        showAlert("กำลังตรวจสอบข้อมูลการเข้าสู่ระบบ...", false);

        const res = await AuthService.signIn(email, password);

        if (res.success) {
          showAlert(res.user.status || "เข้าสู่ระบบสำเร็จ กำลังนำท่านเข้าสู่แดชบอร์ด...", false);
          setTimeout(() => {
            window.location.href = "index.html";
          }, 400);
        } else {
          showAlert(res.message, true);
        }
      });
    });
  </script>
</body>
</html>
